name: ahorrapp_movil
description: Aplicacion movil de AhorrApp.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  table_calendar: ^3.2.0
  intl: ^0.20.3                      # 👈 nuevo — antes venía transitivo de table_calendar
  flutter_secure_storage: ^9.2.2     # 👈 nuevo — para guardar el token del login

  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  home_widget: ^0.9.3
  supabase_flutter: ^2.8.1
  http: ^1.1.0
  local_auth: ^2.3.0
  quick_actions: ^1.0.9
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/piggy-bank-solid.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/